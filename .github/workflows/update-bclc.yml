name: 更新BCLC数据快照

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests 2>/dev/null || true

      - name: Fetch & Predict
        run: python fetch_bclc.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: 更新BCLC数据+预测"
          git push
        continue-on-error: true

      - name: Diagnose
        if: failure()
        run: |
          echo "::warning::BCLC接口可能不可达，将使用种子数据"
          python -c "
          import json, os
          # 确保至少有种子数据
          if not os.path.exists('data.json') or os.path.getsize('data.json') < 100:
              os.system('python fetch_bclc.py')
          "
          git add data.json
          git diff --cached --quiet || git commit -m "chore: 种子数据兜底"
          git push || true
