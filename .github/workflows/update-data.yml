name: 更新数据快照
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取最新数据
        run: python3 fetch_data.py
      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: 自动更新数据快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
