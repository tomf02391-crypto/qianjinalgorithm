name: 更新PC28数据快照

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Check maintenance window
        id: check_time
        run: |
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          MIN=$(TZ='Asia/Shanghai' date +%M)
          echo "北京时间: ${HOUR}:${MIN}"
          # 维护窗口 19:00-19:30 跳过
          if [ "$HOUR" = "19" ] && [ "$MIN" -ge "0" ] && [ "$MIN" -lt "30" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ 维护窗口，跳过"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ 正常运行"
          fi

      - name: Fetch & Predict
        if: steps.check_time.outputs.skip != 'true'
        run: python fetch_data.py

      - name: Diagnose failure
        if: failure()
        run: |
          echo "=== 诊断信息 ==="
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          curl -s -o /dev/null -w "pc28.help: %{http_code}\n" "https://pc28.help/api/keno.json" --max-time 5 || echo "pc28.help: 不可达"
          python -c "import fetch_data; print('fetch_data.py 导入正常')" 2>&1 || echo "fetch_data.py 导入失败"

      - name: Commit
        if: steps.check_time.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: 更新PC28数据+V8预测"
          git push
        continue-on-error: true
